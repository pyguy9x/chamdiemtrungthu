<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chấm điểm Trung Thu 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f5f5f5;color:#333}
.header{background:linear-gradient(135deg,#1a237e,#283593);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:20px}
.judge-badge{background:#ff6f00;padding:6px 16px;border-radius:20px;font-weight:bold}
.container{max-width:1400px;margin:0 auto;padding:16px}
.config-bar{background:#fff3e0;border:2px dashed #ff9800;padding:12px 16px;margin-bottom:16px;border-radius:8px;display:none}
.config-bar.visible{display:block}
.config-bar label{font-weight:bold;margin-right:8px;font-size:14px}
.config-bar input{width:300px;padding:4px 8px;margin:4px;border:1px solid #ccc;border-radius:4px;font-size:14px}
.config-bar button{padding:6px 14px;background:#ff9800;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-left:8px;font-size:14px}
.config-bar button:hover{background:#e68900}
.model-card{background:#fff;border-radius:8px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden}
.model-header{background:#e8eaf6;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.model-header:hover{background:#c5cae9}
.model-header .info{font-size:16px;font-weight:bold}
.model-header .unit{color:#555;font-size:14px}
.model-header .total{background:#1a237e;color:#fff;padding:4px 12px;border-radius:12px;font-weight:bold}
.model-body{padding:16px;display:none}
.model-body.open{display:block}
.criteria{margin-bottom:16px}
.criteria-title{background:#3f51b5;color:#fff;padding:8px 12px;border-radius:4px;font-weight:bold;margin-bottom:8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.criteria-title .max-points{font-weight:normal;opacity:.9;white-space:nowrap}
.sub-criteria{margin-left:16px;margin-bottom:8px}
.sub-criteria .label{font-size:14px;color:#555;margin-bottom:4px;line-height:1.4}
.sub-criteria .stars{display:flex;gap:4px}
.num-btn{width:38px;height:38px;background:#e0e0e0;border:2px solid #bdbdbd;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold;font-size:14px;transition:all .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.num-btn:hover{background:#c5cae9}
.num-btn:active{transform:scale(0.95)}
.num-btn.active{background:#ff6f00!important;border-color:#e65100!important;color:#fff!important}
.criteria-total{text-align:right;font-size:18px;font-weight:bold;color:#1a237e;margin-top:8px;padding-top:8px;border-top:2px solid #e8eaf6}
.btn-save{background:#4caf50;color:#fff;padding:12px 32px;border:none;border-radius:6px;font-size:16px;cursor:pointer;display:block;margin:16px auto}
.btn-save:hover{background:#388e3c}
.btn-save:disabled{background:#a5d6a7;cursor:not-allowed}
.status-bar{padding:10px 16px;margin-top:8px;border-radius:4px;display:none;text-align:center;font-size:14px}
.status-bar.success{background:#e8f5e9;color:#2e7d32;display:block}
.status-bar.error{background:#ffebee;color:#c62828;display:block}
.tab-bar{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{padding:10px 14px;background:#e8eaf6;border:none;border-radius:8px 8px 0 0;cursor:pointer;font-weight:bold;font-size:14px;min-height:44px}
.tab-btn.active{background:#1a237e;color:#fff}
.summary-wrap{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
.summary-head{padding:14px 16px;background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.summary-head h2{font-size:17px}
.summary-head button{padding:6px 14px;border:none;border-radius:6px;background:#ff6f00;color:#fff;font-weight:bold;cursor:pointer}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.summary-table{width:100%;border-collapse:collapse;min-width:760px;font-size:14px}
.summary-table th{background:#e8eaf6;color:#1a237e;padding:10px 8px;text-align:center;white-space:nowrap;font-size:13px}
.summary-table td{padding:9px 8px;border-bottom:1px solid #eee;text-align:center}
.summary-table td:nth-child(2),.summary-table td:nth-child(3){text-align:left}
.summary-table tr:nth-child(even){background:#fafbff}
.rank-1{background:linear-gradient(90deg,#fff8e1,#ffecb3)!important;font-weight:bold}
.rank-2{background:#f3e5f5!important}
.rank-3{background:#e3f2fd!important}
.badge{display:inline-block;min-width:28px;padding:3px 8px;border-radius:12px;color:#fff;font-weight:bold;font-size:13px}
.badge-1{background:#ff6f00}
.badge-2{background:#8e24aa}
.badge-3{background:#1565c0}
@media(max-width:600px){
 body{font-size:16px}
 .header{padding:12px 14px;flex-direction:column;gap:8px;text-align:center}
 .header h1{font-size:18px}
 .judge-badge{font-size:15px;padding:6px 14px}
 .container{padding:10px}
 .tab-bar{gap:6px}
 .tab-btn{font-size:15px;padding:10px 12px;flex:1 1 auto;text-align:center}
 .model-header{padding:14px}
 .model-header .info{font-size:17px}
 .model-header .unit{font-size:15px}
 .model-body{padding:12px}
 .criteria-title{font-size:16px;padding:10px 12px;flex-wrap:wrap}
 .sub-criteria .label{font-size:15px;line-height:1.5}
 .num-btn{width:40px;height:40px;font-size:15px}
 .criteria-total{font-size:17px}
 .btn-save{font-size:18px;padding:14px 28px;width:92%;max-width:360px}
 .config-bar input{width:100%;font-size:16px;padding:8px}
 .summary-table{font-size:13px;min-width:680px}
}
</style>
</head>
<body>
<div class="header">
  <h1>🎯 Bảng Chấm Điểm Trung Thu 2026</h1>
  <div class="judge-badge" id="judgeName">Giám khảo</div>
</div>
<div class="container">
  <div class="config-bar" id="configBar" style="display:none">
    <input type="hidden" id="supabaseUrl">
    <input type="hidden" id="supabaseKey">
  </div>
  <div class="tab-bar" id="tabBar"></div>
  <div id="modelsContainer"></div>
  <div id="summaryContainer" style="display:none"></div>
  <button class="btn-save" id="saveBtn" onclick="saveAll()">💾 Lưu tất cả điểm</button>
  <div class="status-bar" id="statusBar"></div>
</div>

<script>
const MODELS=[
{stt:1,name:"Vó Ngựa Phù Đổng",unit:"Thôn Mậu A 1"},
{stt:2,name:"Ngôi Sao",unit:"Thôn Mậu A 2"},
{stt:3,name:"Thỏ Ngọc Trông Trăng",unit:"Thôn Mậu A 3"},
{stt:4,name:"Thỏ Vàng Khát Vọng",unit:"Thôn Mậu A 5"},
{stt:5,name:"Đèn Kéo Quân",unit:"Thôn Mậu A 6"},
{stt:6,name:"Ánh trăng miền Quế",unit:"Trường Mầm Non Mậu A 1"},
{stt:7,name:"Phượng hoàng chẩy hội",unit:"Trường Mầm Non Mậu A 2"},
{stt:8,name:"Ánh trăng rằm bản em",unit:"Trường Mầm non Sơn Ca"},
{stt:9,name:"Tết trung thu - trăng sáng trên thác khe cam",unit:"Tiểu học Mậu A 1"},
{stt:10,name:"Chú cuội bên gốc cây đa",unit:"Tiểu học Mậu A 2"},
{stt:11,name:"Mái chùa đón trăng",unit:"Trường THCS Mậu A 2"},
{stt:12,name:"Thiên Mã Đón Trăng",unit:"Trường THCS Mậu A 1"},
{stt:13,name:"Trung thu vùng cao giữ gìn bản sắc thắp sáng ước mơ",unit:"Thôn Ngòi A 3"},
{stt:14,name:"Ngôi Sao",unit:"Thôn An Thịnh 1"},
{stt:15,name:"Cá Chép",unit:"Thôn An Thịnh 2"},
{stt:16,name:"Mặt trăng rằm tháng 8",unit:"Thôn An Thịnh 3"},
{stt:17,name:"Cá Chép",unit:"Thôn An Thịnh 4"},
{stt:18,name:"Thỏ Ngọc Cung Trăng",unit:"Thôn An Thịnh 5"},
{stt:19,name:"Nhà Sàn Bác Hồ",unit:"Thôn Mậu Đông 1"},
{stt:20,name:"Cá Chép",unit:"Thôn Mậu Đông 2"},
{stt:21,name:"Đèn ông sao và đèn kéo quân",unit:"Trường THPH Chu Văn An"},
{stt:22,name:"Đèn Lồng Trung Thu",unit:"Trường PTDTNT THCS&THPT"},
{stt:23,name:"Nhà sàn, con đường và linh vật thỏ ngọc",unit:"Thôn Yên Thái 2"},
{stt:24,name:"Trăng thu đất việt",unit:"Trường Mầm Non Ban Mai"},
{stt:25,name:"Cá Chép",unit:"Trường THPH Lương Bằng"},
{stt:26,name:"Cá Chép",unit:"Thôn Ngòi A 1"},
{stt:27,name:"Đón trăng về bản",unit:"Thôn Yên Thái 1"}
];

const CRITERIA=[
{id:1,title:"Ý tưởng sáng tạo, chủ đề, thông điệp (30 điểm)",max:30,
 subs:[
  {label:"1. Tính sáng tạo: thể hiện được tính độc đáo, mới lạ của ý tưởng mô hình hoặc linh vật",max:10},
  {label:"2. Chủ đề: phù hợp với Tết Trung Thu, truyền tải được nét văn hóa dân gian.",max:10},
  {label:"3. Thông điệp ý nghĩa: Mô hình hoặc linh vật mang thông điệp tích cực, truyền cảm hứng cho cộng đồng.",max:10}
 ]},
{id:2,title:"Kỹ thuật, mỹ thuật, kết cấu (25 điểm)",max:25,
 subs:[
  {label:"1. Kỹ thuật chế tác: Độ tinh xảo, chính xác trong các chi tiết, kỹ thuật thực hiện.",max:5},
  {label:"2. Mỹ thuật tổng thể: Bố cục hài hòa, màu sắc bắt mắt, hình thức thẩm mỹ cao.",max:10},
  {label:"3. Kết cấu vững chắc: Đảm bảo độ chắc chắn, an toàn khi di chuyển hoặc trưng bày; có khả năng sử dụng nhiều lần.",max:10}
 ]},
{id:3,title:"Chất liệu, thân thiện bảo vệ môi trường (20 điểm)",max:20,
 subs:[
  {label:"1. Chất liệu sử dụng: Ưu tiên vật liệu tự nhiên, vật liệu tái chế.",max:5},
  {label:"2. An toàn cho người sử dụng: Không chứa chất độc hại, đảm bảo sức khỏe cộng đồng.",max:10},
  {label:"3. Góp phần bảo vệ môi trường: Ý thức bảo vệ môi trường được lồng ghép vào mô hình hoặc linh vật.",max:5}
 ]},
{id:4,title:"Tính cộng đồng, đặc trưng bản sắc (15 điểm)",max:15,
 subs:[
  {label:"1. Đặc trưng vùng miền: Mô hình, linh vật mang dấu ấn bản sắc địa phương hoặc dân tộc.",max:5},
  {label:"2. Tính lan tỏa cộng đồng: Khuyến khích sự tham gia, gắn kết của nhiều người.",max:5},
  {label:"3. Giá trị nhân văn: Thúc đẩy tinh thần đoàn kết, chia sẻ, tôn vinh nét đẹp truyền thống.",max:5}
 ]},
{id:5,title:"Các thức biểu diễn thuyết trình (10 điểm)",max:10,
 subs:[
  {label:"1. Diễn diễn linh hoạt: Mô hình, linh vật dễ dàng di chuyển, trình diễn trước đám đông.",max:5},
  {label:"2. Thuyết trình sinh động: Người trình bày có khả năng truyền đạt thông điệp, tạo sự hấp dẫn cho khán giả.",max:5}
 ]}
];

const JUDGES=["loi","hieu","hung","loan","cuong"];
const JN={loi:"Lợi",hieu:"Hiếu",hung:"Hùng",loan:"Loan",cuong:"Cường"};

let currentJudge="loi";
let scores={};
let config=null;
const DC={url:"https://zipvocbtmilyeuhqqrur.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppcHZvY2J0bWlseWV1aHFxcnVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNTY0NjgsImV4cCI6MjA5OTgzMjQ2OH0.-LUZdiukACGQS7pR71HNFmxmDkDGNi2x3Rs6KM9nN5s"};
const SK=key=>`cd2026_${key}`;

function init(){
  const view=new URLSearchParams(window.location.search).get("view");
  if(view==='tonghop'){ isSummary=true; }
  currentJudge=JUDGES.includes(getJudgeFromURL())?getJudgeFromURL():"loi";
  document.getElementById("judgeName").textContent=isSummary?"📊 Tổng hợp điểm":"Giám khảo "+JN[currentJudge];
  loadConfig();
  buildTabs();
  buildModels();
  loadScores();
  if(isSummary){
    document.getElementById("modelsContainer").style.display="none";
    document.getElementById("saveBtn").style.display="none";
    document.getElementById("summaryContainer").style.display="";
    loadSummary();
  }
}

function getJudgeFromURL(){return new URLSearchParams(window.location.search).get("judge")||"loi";}

let isSummary=false;
function buildTabs(){
  const bar=document.getElementById("tabBar");
  let h='';
  JUDGES.forEach(j=>{
    const isCurActive = j===currentJudge && !isSummary;
    const isCurLink = j===currentJudge;
    let tot=0;
    try{
      const s=JSON.parse(localStorage.getItem(SK(j))||'{}');
      Object.values(s).forEach(ms=> Object.values(ms).forEach(cs=> Object.values(cs).forEach(v=> tot+=+v||0)));
    }catch(e){}
    const label = tot>0 ? `GK ${JN[j]} <small style="opacity:.8;font-weight:normal">(${tot}đ)</small>` : `GK ${JN[j]}`;
    if(isCurActive){
      h+=`<button class="tab-btn active" style="background:#1a237e;color:#fff;box-shadow:0 2px 8px rgba(26,35,126,.35);transform:translateY(-1px)">${label}</button>`;
    }else if(isCurLink && isSummary){
      h+=`<button class="tab-btn" onclick="switchJudge()" title="Quay lại chấm điểm" style="background:#e8eaf6;color:#1a237e;border:1px solid #9fa8da;cursor:pointer">${label}</button>`;
    }else{
      h+=`<button class="tab-btn" disabled title="Chỉ xem — link của ${JN[j]}" style="opacity:.6;cursor:not-allowed;background:#eceff1;color:#616161;border:1px solid #cfd8dc">${label}</button>`;
    }
  });
  h+=`<button class="tab-btn ${isSummary?'active':''}" onclick="showSummary(this)" style="background:${isSummary?'#ff6f00':'#fff3e0'};color:${isSummary?'#fff':'#e65100'};border:1px solid #ffcc80">📊 Tổng hợp</button>`;
  bar.innerHTML=h;
  refreshOtherTotals();
}
async function refreshOtherTotals(){
  if(!config) return;
  try{
    const r=await fetch(`${config.url}/rest/v1/diem_trung_thu_2026?select=nguoi_cham,tong_diem`,{headers:{apikey:config.key,Authorization:`Bearer ${config.key}`}});
    if(!r.ok) return;
    const rows=await r.json();
    const sums={}; rows.forEach(x=>{ sums[x.nguoi_cham]=(sums[x.nguoi_cham]||0)+(+x.tong_diem||0); });
    const bar=document.getElementById("tabBar");
    JUDGES.forEach((j,i)=>{
      if(j===currentJudge) return;
      const tot=sums[j];
      if(tot==null) return;
      const btn=bar.querySelectorAll('.tab-btn')[i];
      if(btn) btn.innerHTML=`GK ${JN[j]} <small style="opacity:.8;font-weight:normal">(${tot}đ)</small>`;
    });
  }catch(e){}
}

function buildModels(){
  const c=document.getElementById("modelsContainer");
  c.innerHTML=MODELS.map((m,idx)=>{
    let h='';
    CRITERIA.forEach(crit=>{
      h+=`<div class="criteria"><div class="criteria-title">${crit.title} <span class="max-points">(Tối đa ${crit.max} điểm)</span></div>`;
      crit.subs.forEach((sub,si)=>{
        h+=`<div class="sub-criteria"><div class="label">${sub.label} <span style="color:#999">(max ${sub.max} điểm)</span></div><div class="stars">${starsHTML(`m${idx}_c${crit.id}_s${si}`,sub.max)}</div></div>`;
      });
      h+=`<div class="criteria-total">Tổng: <span id="csum_${idx}_${crit.id}">0</span>/${crit.max}</div></div>`;
    });
    return`<div class="model-card" id="card_${idx}"><div class="model-header" onclick="toggleModel(${idx})"><div><span class="info">STT ${m.stt}. ${m.name}</span><br><span class="unit">${m.unit}</span></div><div class="total" id="mtotal_${idx}">0</div></div><div class="model-body" id="body_${idx}">${h}</div></div>`;
  }).join('');
}

function starsHTML(key,max){
  let h='<div style="display:flex;gap:4px;flex-wrap:wrap">';
  for(let i=0;i<=max;i++) h+=`<button type="button" class="num-btn" data-key="${key}" data-val="${i}" onclick="onNumClick(this)">${i}</button>`;
  h+='</div>';
  return h;
}
function onNumClick(btn){
  const key=btn.dataset.key, val=+btn.dataset.val;
  const p=key.match(/m(\d+)_c(\d+)_s(\d+)/);
  const mi=+p[1],ci=+p[2],si=+p[3];
  if(!scores[mi])scores[mi]={};
  if(!scores[mi][ci])scores[mi][ci]={};
  scores[mi][ci][si]=val;
  document.querySelectorAll(`.num-btn[data-key="${key}"]`).forEach(b=>{
    b.classList.toggle('active', +b.dataset.val===val);
  });
  updateSums(mi,ci);
  persistScores();
}

function setScore(key,val){
  const p=key.match(/m(\d+)_c(\d+)_s(\d+)/);
  const mi=+p[1],ci=+p[2],si=+p[3];
  if(!scores[mi])scores[mi]={};
  if(!scores[mi][ci])scores[mi][ci]={};
  scores[mi][ci][si]=val;
  document.querySelectorAll(`.num-btn[data-key="${key}"]`).forEach(b=> b.classList.toggle('active', +b.dataset.val===val));
  updateSums(mi,ci);
  persistScores();
}

function updateSums(mi,ci){
  const c=CRITERIA.find(x=>x.id===ci),s=scores[mi]?.[ci]||{};
  let sum=0;
  c.subs.forEach((_,si)=>{sum+=(s[si]||0);});
  const se=document.getElementById(`csum_${mi}_${ci}`);
  if(se)se.textContent=sum;
  let total=0;
  CRITERIA.forEach(c2=>{const s2=scores[mi]?.[c2.id]||{};c2.subs.forEach((_,si2)=>{total+=(s2[si2]||0);});});
  const te=document.getElementById(`mtotal_${mi}`);
  if(te)te.textContent=total;
}

function toggleModel(idx){
  document.getElementById(`body_${idx}`).classList.toggle("open");
}

function persistScores(){
  try{localStorage.setItem(SK(currentJudge),JSON.stringify(scores));}catch(e){}
}

function loadScores(){
  try{
    const saved=localStorage.getItem(SK(currentJudge));
    scores=saved?JSON.parse(saved):{};
  }catch(e){scores={}}
  refreshUI();
}

function refreshUI(){
  MODELS.forEach((m,idx)=>{
    CRITERIA.forEach(crit=>{
      const s=scores[idx]?.[crit.id]||{};
      let cs=0;
      crit.subs.forEach((_,si)=>{cs+=(s[si]||0);});
      const se=document.getElementById(`csum_${idx}_${crit.id}`);
      if(se)se.textContent=cs;
      crit.subs.forEach((_,si)=>{
        const val=s[si]||0;
        document.querySelectorAll(`.num-btn[data-key="m${idx}_c${crit.id}_s${si}"]`).forEach(b=> b.classList.toggle('active', +b.dataset.val===val));
      });
    });
    let total=0;
    CRITERIA.forEach(crit=>{const s=scores[idx]?.[crit.id]||{};crit.subs.forEach((_,si)=>{total+=(s[si]||0);});});
    const te=document.getElementById(`mtotal_${idx}`);
    if(te)te.textContent=total;
  });
}

function switchJudge(j,btn){
  if(!isSummary) return;
  persistScores();
  isSummary=false;
  history.replaceState(null,'',`?judge=${currentJudge}`);
  document.getElementById("judgeName").textContent="Giám khảo "+JN[currentJudge];
  document.getElementById("modelsContainer").style.display="";
  document.getElementById("summaryContainer").style.display="none";
  document.getElementById("saveBtn").style.display="";
  buildTabs();
  loadScores();
}
function showSummary(btn){
  if(isSummary) return;
  persistScores();
  isSummary=true;
  history.replaceState(null,'',`?view=tonghop`);
  document.getElementById("judgeName").textContent="📊 Tổng hợp điểm";
  document.getElementById("modelsContainer").style.display="none";
  document.getElementById("saveBtn").style.display="none";
  document.getElementById("summaryContainer").style.display="";
  buildTabs();
  loadSummary();
}
async function loadSummary(){
  const c=document.getElementById("summaryContainer");
  c.innerHTML='<div style="padding:24px;text-align:center;color:#666">⏳ Đang tải dữ liệu...</div>';
  if(!config){ c.innerHTML='<div style="padding:20px;text-align:center;color:#c62828">Chưa cấu hình Supabase</div>'; return; }
  try{
    let rows=null;
    let r=await fetch(`${config.url}/rest/v1/bang_tong_hop_diem?select=*&order=stt`,{headers:{apikey:config.key,Authorization:`Bearer ${config.key}`}});
    if(r.ok){ rows=await r.json(); }
    if(!rows || !rows.length){
      r=await fetch(`${config.url}/rest/v1/diem_trung_thu_2026?select=stt,ten_mo_hinh,ten_don_vi,nguoi_cham,tong_diem`,{headers:{apikey:config.key,Authorization:`Bearer ${config.key}`}});
      if(!r.ok) throw new Error(await r.text());
      const raw=await r.json();
      const map={};
      raw.forEach(rw=>{
        if(!map[rw.stt]) map[rw.stt]={stt:rw.stt,ten_mo_hinh:rw.ten_mo_hinh,ten_don_vi:rw.ten_don_vi,diem_gk_loi:0,diem_gk_hieu:0,diem_gk_hung:0,diem_gk_loan:0,diem_gk_cuong:0};
        const k='diem_gk_'+rw.nguoi_cham; if(k in map[rw.stt]) map[rw.stt][k]=rw.tong_diem;
      });
      rows=Object.values(map).map(x=>({...x,diem_tb:Math.round(((x.diem_gk_loi||0)+(x.diem_gk_hieu||0)+(x.diem_gk_hung||0)+(x.diem_gk_loan||0)+(x.diem_gk_cuong||0))/5*10)/10})).sort((a,b)=>a.stt-b.stt);
    }
    if(!rows.length){ c.innerHTML='<div style="padding:24px;text-align:center;color:#666">Chưa có dữ liệu chấm điểm</div>'; return; }
    const sorted=[...rows].sort((a,b)=> (b.diem_tb||0)-(a.diem_tb||0));
    const rankMap={}; sorted.forEach((r,i)=>{ if(i>0 && r.diem_tb===sorted[i-1].diem_tb) rankMap[r.stt]=rankMap[sorted[i-1].stt]; else rankMap[r.stt]=i+1; });
    rows.forEach(r=> r.hang=rankMap[r.stt]);
    rows.sort((a,b)=> a.hang-b.hang || a.stt-b.stt);
    let html=`<div class="summary-wrap"><div class="summary-head"><h2>📊 Bảng tổng hợp điểm (${rows.length} mô hình)</h2><button onclick="loadSummary()">↻ Làm mới</button></div><div class="table-scroll"><table class="summary-table"><thead><tr><th>Hạng</th><th>STT</th><th>Tên mô hình</th><th>Đơn vị</th><th>GK Lợi</th><th>GK Hiếu</th><th>GK Hùng</th><th>GK Loan</th><th>GK Cường</th><th>TB</th></tr></thead><tbody>`;
    rows.forEach(r=>{
      const rc=r.hang===1?'rank-1':r.hang===2?'rank-2':r.hang===3?'rank-3':'';
      const bc=r.hang===1?'badge-1':r.hang===2?'badge-2':r.hang===3?'badge-3':'';
      const badge=r.hang<=3?`<span class="badge ${bc}">${r.hang===1?'🥇':r.hang===2?'🥈':'🥉'} ${r.hang}</span>`:`<span class="badge" style="background:#78909c">${r.hang}</span>`;
      html+=`<tr class="${rc}"><td>${badge}</td><td>${r.stt}</td><td style="font-weight:600">${r.ten_mo_hinh||''}</td><td>${r.ten_don_vi||''}</td><td>${r.diem_gk_loi??'-'}</td><td>${r.diem_gk_hieu??'-'}</td><td>${r.diem_gk_hung??'-'}</td><td>${r.diem_gk_loan??'-'}</td><td>${r.diem_gk_cuong??'-'}</td><td style="font-weight:bold;color:#1a237e">${r.diem_tb??0}</td></tr>`;
    });
    html+='</tbody></table></div></div>';
    c.innerHTML=html;
  }catch(e){ c.innerHTML=`<div style="padding:20px;text-align:center;color:#c62828">Lỗi tải: ${e.message.substring(0,120)}</div>`; }
}

function loadConfig(){
  config=DC;
  try{localStorage.setItem('cd2026_config',JSON.stringify(config));}catch(e){}
}

function saveConfig(){
  const url=document.getElementById("supabaseUrl").value.trim();
  const key=document.getElementById("supabaseKey").value.trim();
  if(!url||!key){alert("Vui lòng nhập đầy đủ URL và Key!");return;}
  config={url,key};
  localStorage.setItem('cd2026_config',JSON.stringify(config));
  document.getElementById("configBar").classList.add("visible");
  showStatus("✅ Đã lưu cấu hình Supabase!","success");
}

function testConn(){
  if(!config){showStatus("⚠️ Chưa cấu hình Supabase!","error");return;}
  fetch(`${config.url}/rest/v1/diem_trung_thu_2026?limit=1`,{headers:{apikey:config.key,Authorization:`Bearer ${config.key}`}})
    .then(r=>r.ok?showStatus("✅ Kết nối Supabase thành công!","success"):r.json().then(e=>showStatus("⚠️ "+e.message+" - Chạy setup-supabase.sql trước.","error")))
    .catch(()=>showStatus("❌ Không thể kết nối Supabase!","error"));
}

function saveAll(){
  if(!config){showStatus("⚠️ Cần cấu hình Supabase trước!","error");return;}
  const btn=document.getElementById("saveBtn");
  btn.disabled=true;btn.textContent="⏳ Đang lưu...";
  const payload=MODELS.map((m,idx)=>{
    const s=scores[idx]||{};
    const total=CRITERIA.reduce((acc,c)=>acc+c.subs.reduce((a2,_,si)=>a2+(s[c.id]?.[si]||0),0),0);
    return{stt:m.stt,ten_mo_hinh:m.name,ten_don_vi:m.unit,nguoi_cham:currentJudge,
      diem_c1_s1:s[1]?.[0]||0,diem_c1_s2:s[1]?.[1]||0,diem_c1_s3:s[1]?.[2]||0,
      diem_c2_s1:s[2]?.[0]||0,diem_c2_s2:s[2]?.[1]||0,diem_c2_s3:s[2]?.[2]||0,
      diem_c3_s1:s[3]?.[0]||0,diem_c3_s2:s[3]?.[1]||0,diem_c3_s3:s[3]?.[2]||0,
      diem_c4_s1:s[4]?.[0]||0,diem_c4_s2:s[4]?.[1]||0,diem_c4_s3:s[4]?.[2]||0,
      diem_c5_s1:s[5]?.[0]||0,diem_c5_s2:s[5]?.[1]||0,tong_diem:total};
  });
  fetch(`${config.url}/rest/v1/diem_trung_thu_2026?on_conflict=stt,nguoi_cham`,{
    method:"POST",
    headers:{"apikey":config.key,Authorization:`Bearer ${config.key}`,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
    body:JSON.stringify(payload)
  }).then(r=>{
    if(!r.ok) return r.text().then(t=>{throw new Error(t||('HTTP '+r.status))});
    return r.text().then(t=>{ if(!t) return []; try{return JSON.parse(t);}catch(e){return [];}});
  }).then(()=>{showStatus("✅ Lưu thành công!","success");btn.disabled=false;btn.textContent="💾 Lưu tất cả điểm";})
  .catch(e=>{const msg=e.message?.includes('PGRST205')||e.message?.includes('table')?"❌ Table chưa tồn tại! Chạy setup-supabase.sql trước.":"❌ Lỗi: "+(e.message||e);showStatus(msg,"error");btn.disabled=false;btn.textContent="💾 Lưu tất cả điểm";});
}

function showStatus(msg,type){const bar=document.getElementById("statusBar");bar.textContent=msg;bar.className=`status-bar ${type}`;}

loadConfig();
init();
</script>
